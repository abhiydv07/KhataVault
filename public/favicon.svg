<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Vault / Shield Outline -->
  <path d="M256 72 L392 132 V252 C392 344 332 416 256 444 C180 416 120 344 120 252 V132 Z" 
        fill="#0f172a" 
        fill-opacity="0.25"
        stroke="#ffffff" 
        stroke-width="16" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Rupee Symbol in Center -->
  <text x="256" y="300" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="200" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle"
        dominant-baseline="central">₹</text>

  <!-- Lock Clasp at top -->
  <circle cx="256" cy="115" r="16" fill="url(#goldGrad)"/>
</svg>

